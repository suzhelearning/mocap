[workspace]
channels = ["conda-forge"]
name = "mocap"
platforms = ["linux-64"]
version = "1.0.0"

[tasks]
view = "mocap-viewer"
view-open = "mocap-viewer --open"
subscribe = "python scripts/zenoh_consumer.py"
track-rigid = "python scripts/track_rigid.py"
calibrate-tcp = "python scripts/calibrate_tcp.py"
test = "pytest src/mocap_viewer/tests -q"
test-track-rigid = "python -m unittest tests.test_track_rigid"

[dependencies]
python = "3.12.*"
pytest = ">=8,<9"

[pypi-dependencies]
eclipse-zenoh = ">=1.9, <1.10"
natnet-zenoh = { path = "natnet", editable = true }
mocap-viewer = { path = "src/mocap_viewer", editable = true }
