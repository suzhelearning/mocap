[workspace]
channels = ["conda-forge"]
name = "acquisition"
platforms = ["linux-64"]
version = "1.0.0"
description = "人类操作演示数据采集:动捕手腕位姿 + Manus 手部骨架拼接、web 可视化、按键录制 HDF5"

[tasks]
record = "python -m acquisition.cli"
record-noviz = "python -m acquisition.cli --no-viz"
inspect = "python scripts/inspect_hdf5.py"
replay = "python scripts/replay_hdf5.py"
viz-h5 = "python scripts/viz_hdf5.py"   # 用法: pixi run viz-h5 -- <日期文件夹> [--port 8082]
mano-beta = "python scripts/mano_beta.py"  # 从至多1000帧关键点估计每只手 beta
object-offset = "python scripts/motive_object_offset.py"  # 原始 H5 -> 真实 OBJ frame 派生 H5
add-object-offset = "python scripts/add_object_offset.py"  # Motive Visuals GL/GO -> config/object_offsets.yaml
capture-wrist-landmarks = "python scripts/capture_wrist_landmarks.py"  # 重采左右五指桌面地标
test = "pytest tests"
start-router = "bash scripts/start_zenohd.sh"

[dependencies]
python = "3.12.*"            # natnet-zenoh 要求 >=3.12,<3.13,不能复用 manus 的 3.14
numpy = ">=1.26,<3"
h5py = ">=3.11,<4"
pyyaml = ">=6,<7"
viser = ">=1.0.30,<2"
pytest = ">=8,<9"
scipy = ">=1.18.0,<2"
"ruamel.yaml" = ">=0.19.1,<0.20"
chumpy = ">=0.70,<0.71"

[pypi-dependencies]
eclipse-zenoh = ">=1.9,<1.10"
natnet-zenoh = { path = "../natnet", editable = true }

[activation]
env = { PYTHONPATH = "src" }
