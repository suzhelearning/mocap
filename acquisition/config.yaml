# acquisition 运行时配置 — 加载与校验见 src/acquisition/config.py
# 使用前需按真机情况修改:刚体 ID、手腕 offset、轴变换

router:
  endpoint: "tcp/127.0.0.1:7447"   # Ubuntu 本机 zenohd(常驻 Router)

# Motive 中定义的刚体(Motive Y-up 右手系、米制)
# 命名分工:
#   Manus 手骨架   → left_hand / right_hand(zenoh topic: manus/raw_skeleton/{left,right}_hand)
#   Motive 手腕刚体 → left_wrist / right_wrist(手背 marker 构建,需 offset 推算手腕)
# ⚠ 实测确认:刚体 ID 1 = right_wrist,2 = left_wrist(左/右按操作者物理左右;
#   曾按相反假设配置导致双手数据/坐标轴错位,勿再改回)
rigid_bodies:
  back: 2
  objects:                         # 物体刚体 ID → 名字(采集时各物体单独建刚体)
    cylinder: 3

hands:
  left:
    back_rigid_id: 2               # Motive 刚体 left_wrist(实测 2 号)
    wrist_offset:                  # ⚠ 未标定,占位零偏移:链路验证可用,数据不真实
      mode: body                   # body=随刚体旋转(推荐);world=固定世界方向
      xyz: [0.0, 0.0, 0.0]         # 标定后填:手背刚体 → 手腕的实际偏移
  right:
    back_rigid_id: 1               # Motive 刚体 right_wrist(实测 1 号)
    wrist_offset:
      mode: body
      xyz: [0.0, 0.0, 0.0]
  # 若 Motive 直接追踪手腕刚体(无 offset 场景),改用 wrist_rigid_id 即可

axis_transform:                    # Manus 骨架(z-up) → Motive 系(y-up) 轴变换
  permutation: [0, 2, 1]           # 输出 = (输入[0], 输入[2], 输入[1])
  signs: [1, 1, -1]                # A·d = (d_x, d_z, -d_y) = 绕 X -90°
  # 标定:开 live_view 看手指方向;上/下颠倒改 signs,左/右颠倒改 permutation

recording:
  output_dir: "/home/current/data"   # 数据根目录;录制自动建 <日期>/ 子目录,文件名=时间
  store_markers: true              # true=存原始 markers(vlen);false=只存刚体+手腕+手部
  sample_hz: 100                   # 采集落盘目标频率(输入流 120Hz 时下采样;web 可动态改)
  chunk_frames: 4096               # HDF5 resize 批大小

keys:
  start: r                         # 空闲 → 开始录制
  save: s                          # 停止并保存
  discard: d                       # 停止并丢弃
  quit: q                          # 退出(录制中先丢弃当前 take)

viz:
  port: 8081                       # 避开 mocap viewer 8080 / manus viz 8090
