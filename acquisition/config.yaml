# acquisition 运行时配置 — 加载与校验见 src/acquisition/config.py
# 使用前需按真机情况修改:刚体 ID、手腕 offset、轴变换

router:
  endpoint: "tcp/127.0.0.1:7447"   # Ubuntu 本机 zenohd(常驻 Router)

user: shd                           # 操作者:与 manus_pub.sh --user 一致;
                                    # 自动合并 offset/<user>.yaml 的 wrist 标定

# Motive 中定义的刚体(Motive x-forward z-up 右手系、米制)
# 2026-08-24 更新:Motive 全局坐标系已改为 x 前向(forward)、z 向上(up),
# 刚体 ID 已重排——id=1 left_wrist、id=2 right_wrist、id=3 tianji_wrist(原 right_arm)、
# id=4 hammer(旧 cylinder=3 / cube=8 / hammer=9 不再适用)。
# 如需采集 cylinder/cube,先在 Motive 中建对应刚体再加入 objects。
rigid_bodies:
  back: 1                          # 左手腕刚体(与 hands.left.back_rigid_id 一致)
  objects:                         # 物体 ID→名；每个名称必须存在于 config/object_offsets.yaml
    hammer: 4
    tianji_wrist: 3

hands:
  left:
    back_rigid_id: 1               # 物理左手腕(Motive 名 right_wrist,命名错误)
    wrist_offset:                  # ⚠ 未标定,占位零偏移:链路验证可用,数据不真实
      mode: body                   # body=随刚体旋转(推荐);world=固定世界方向
      xyz:                         # 标定后填:手背刚体 → 手腕的实际偏移
      - 0.0206
      - -0.025
      - -0.0967
      yaw_deg: -135.19
      pitch_deg: -70.4
      roll_deg: 149.43
  right:
    back_rigid_id: 2               # 物理右手腕(Motive 名 left_wrist,命名错误)
    wrist_offset:
      mode: body
      xyz:
      - 0.0378
      - 0.0235
      - -0.0923
      yaw_deg: -118.13
      pitch_deg: -42.78
      roll_deg: 97.47
  # 若 Motive 直接追踪手腕刚体(无 offset 场景),改用 wrist_rigid_id 即可

axis_transform:                    # Manus 骨架(z-up) → Motive 系(x-forward z-up) 轴变换
  permutation: [1, 0, 2]           # 输出 = (输入[1], 输入[0], 输入[2])
  signs: [-1, 1, 1]                # A·d = (-d_y, d_x, d_z) = 绕 Y +90°
  # 标定:开 live_view 看手指方向;上/下颠倒改 signs,左/右颠倒改 permutation

recording:
  output_dir: "/home/current/data"   # 数据根目录;录制自动建 <日期>/ 子目录,文件名=时间
  chunk_frames: 4096               # HDF5 resize 批大小

alignment:
  output_hz: 60                    # 唯一公共物理时间轴，固定 60 Hz
  latency_ms: 50                   # 等待目标时刻后的源样本再插值
  mocap_max_gap_ms: 25             # Motive 包围样本间隔超过此值则该帧无效
  manus_max_gap_ms: 35             # Manus 包围样本间隔超过此值则对应手无效

keys:
  start: r                         # 空闲 → 开始录制
  save: s                          # 停止并保存
  discard: d                       # 停止并丢弃
  quit: q                          # 退出(录制中先丢弃当前 take)

viz:
  port: 8081                       # 避开 mocap viewer 8080 / manus viz 8090
